<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nhạc Của Tôi">
  <meta name="theme-color" content="#0a0b10">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/srymcfear/verify_me/refs/heads/main/assets/icon/fear_logo.ico">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/srymcfear/verify_me/refs/heads/main/assets/icon/fear_logo.ico">
  <title>FEAR Music Player</title>
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090a0f 0%, #12131c 50%, #1a1026 100%);
      --surface-color: rgba(22, 24, 38, 0.65);
      --surface-border: rgba(255, 255, 255, 0.08);
      --accent-gradient: linear-gradient(135deg, #8a2be2 0%, #e056fd 100%);
      --accent-cyan: #00f0ff;
      --accent-purple: #e056fd;
      --accent-glow: rgba(224, 86, 253, 0.35);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --danger-color: #ff3b30;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: calc(110px + var(--safe-bottom));
    }

    /* iOS Safe Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid var(--surface-border);
      padding-top: max(12px, var(--safe-top));
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 6px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff 0%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title svg {
      width: 22px;
      height: 22px;
      fill: var(--accent-purple);
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tabs Bar */
    .tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 16px 12px;
      scrollbar-width: none;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: var(--accent-gradient);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .tab-btn:active {
      transform: scale(0.95);
    }

    /* Control & Search Bar */
    .search-control-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      margin: 10px 16px 0;
      background: var(--surface-color);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      padding: 4px;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .icon-action-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .icon-action-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.18);
    }

    .icon-action-btn.accent {
      background: var(--accent-gradient);
      border: none;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .icon-action-btn.drive {
      background: linear-gradient(135deg, #00f0ff 0%, #8a2be2 100%);
      border: none;
      box-shadow: 0 2px 10px rgba(0, 240, 255, 0.3);
    }

    .icon-action-btn.danger {
      background: var(--danger-color);
      border: none;
    }

    /* Main Container */
    .main-content {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
      flex: 1;
    }

    /* Hero / Playing Disc View */
    .hero-player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .vinyl-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 12px 0 20px;
      border-radius: 50%;
      padding: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 30px rgba(138, 43, 226, 0.15);
      transition: transform 0.3s ease;
    }

    .album-art-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #181925;
      display: block;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .vinyl-container.spinning .album-art-img {
      animation: spin 18s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .center-hole {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #090a0f;
      border: 4px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .current-song-meta {
      text-align: center;
      width: 100%;
      padding: 0 10px;
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .hero-artist {
      font-size: 14px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress scrubber */
    .scrubber-box {
      width: 100%;
      margin-top: 16px;
    }

    .scrubber-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 10px;
      box-shadow: 0 0 10px var(--accent-purple);
      transition: width 0.1s linear;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Playlist Section */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-title-text {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface-color);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .song-card:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.08);
    }

    .song-card.playing {
      background: rgba(224, 86, 253, 0.12);
      border-color: rgba(224, 86, 253, 0.4);
      box-shadow: 0 0 15px rgba(224, 86, 253, 0.1);
    }

    .song-thumb {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      object-fit: cover;
      background: #1e1f2e;
      flex-shrink: 0;
    }

    .song-details {
      flex: 1;
      min-width: 0;
    }

    .song-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .song-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Checkbox */
    .custom-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .custom-checkbox.checked {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .custom-checkbox.checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
    }

    /* Wave visualizer icon */
    .playing-indicator {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
    }

    .playing-indicator span {
      width: 3px;
      background: var(--accent-purple);
      border-radius: 3px;
      animation: bounce 1s infinite alternate ease-in-out;
    }

    .playing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .playing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      from { height: 4px; }
      to { height: 14px; }
    }

    /* Mini Player Bar */
    .mini-player-bar {
      position: fixed;
      bottom: var(--safe-bottom);
      left: 12px;
      right: 12px;
      height: 64px;
      background: rgba(18, 19, 30, 0.92);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(138, 43, 226, 0.15);
      cursor: pointer;
    }

    .mini-info-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .mini-cover {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      background: #181925;
      flex-shrink: 0;
    }

    .mini-meta {
      flex: 1;
      min-width: 0;
    }

    .mini-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
    }

    .mini-artist {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mini-btn.play {
      background: var(--accent-gradient);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    .mini-progress-line {
      position: absolute;
      bottom: 0;
      left: 14px;
      right: 14px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .mini-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-purple);
    }

    /* Full Player Overlay Sheet */
    .player-sheet-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2000;
      background: rgba(9, 10, 15, 0.96);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      display: flex;
      flex-direction: column;
      padding: max(20px, var(--safe-top)) 24px max(30px, var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .player-sheet-modal.open {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .sheet-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sheet-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .sheet-cover-box {
      width: 260px;
      height: 260px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
      margin-bottom: 30px;
      background: #181925;
    }

    .sheet-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sheet-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      margin: 24px 0;
    }

    .sheet-ctrl-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .sheet-ctrl-btn:active {
      transform: scale(0.9);
    }

    .sheet-ctrl-btn.play {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--accent-gradient);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Volume Row inside Sheet */
    .volume-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 18px;
      border-radius: 20px;
      border: 1px solid var(--surface-border);
      margin-top: 10px;
    }

    .volume-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-purple);
      box-shadow: 0 0 10px var(--accent-purple);
      cursor: pointer;
    }

    /* Google Drive Modal */
    .gdrive-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 3000;
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .gdrive-modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .gdrive-card {
      background: rgba(20, 22, 35, 0.95);
      border: 1px solid var(--accent-purple);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px var(--accent-glow);
    }

    .gdrive-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .gdrive-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gdrive-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .gdrive-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .gdrive-textarea {
      width: 100%;
      height: 90px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      color: #ffffff;
      padding: 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: none;
    }

    .gdrive-textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .gdrive-btn-group {
      display: flex;
      gap: 10px;
    }

    .gdrive-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease;
    }

    .gdrive-btn:active { transform: scale(0.96); }
    .gdrive-btn.submit {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .gdrive-btn.cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    /* PWA iOS Prompt Banner */
    .pwa-ios-banner {
      position: fixed;
      top: max(10px, var(--safe-top));
      left: 16px;
      right: 16px;
      background: rgba(26, 16, 38, 0.95);
      border: 1px solid rgba(224, 86, 253, 0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 18px;
      padding: 14px 16px;
      z-index: 3000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(224, 86, 253, 0.2);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideDown 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .pwa-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    .pwa-text {
      flex: 1;
      font-size: 13px;
      line-height: 1.4;
      color: #e2e8f0;
    }

    .pwa-text strong {
      color: #ffffff;
    }

    .pwa-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      top: max(20px, var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 24, 38, 0.95);
      border: 1px solid var(--accent-purple);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      z-index: 4000;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
      backdrop-filter: blur(20px);
      pointer-events: none;
      animation: toastFade 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes toastFade {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      15% { opacity: 1; transform: translate(-50%, 0); }
      85% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }

    .empty-state-box {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--surface-border);
      border-radius: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- iOS PWA Install Banner -->
  <div id="pwaBanner" class="pwa-ios-banner" style="display: none;">

  <audio id="audio" preload="metadata" playsinline webkit-playsinline></audio>
  <input type="file" id="fileInput" accept=".mp3,audio/mpeg" multiple style="display: none;">

  <script>
    let db;
    let playlists = {};
    let currentPlaylistName = "❤️";
    let currentIndex = 0;
    let isPlaying = false;
    let selectedSongs = new Set();
    let currentSearchQuery = "";
    let currentSongId = null;
    let currentBlobUrl = null;
    let lastVolume = 70;

    const audio = document.getElementById('audio');
    const fileInput = document.getElementById('fileInput');
    const vinylContainer = document.getElementById('vinylContainer');
    const albumArt = document.getElementById('albumArt');
    const heroTitle = document.getElementById('heroTitle');
    const heroArtist = document.getElementById('heroArtist');
    const barTitle = document.getElementById('barTitle');
    const barArtist = document.getElementById('barArtist');
    const barCover = document.getElementById('barCover');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetArtist = document.getElementById('sheetArtist');
    const sheetCover = document.getElementById('sheetCover');
    
    const mainScrubberFill = document.getElementById('mainScrubberFill');
    const miniProgressFill = document.getElementById('miniProgressFill');
    const sheetScrubberFill = document.getElementById('sheetScrubberFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('duration');
    const sheetCurrentTime = document.getElementById('sheetCurrentTime');
    const sheetDuration = document.getElementById('sheetDuration');
    
    const miniPlayIcon = document.getElementById('miniPlayIcon');
    const sheetPlayIcon = document.getElementById('sheetPlayIcon');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const volumeIcon = document.getElementById('volumeIcon');

    // Register Service Worker for Offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered:', reg.scope))
          .catch(err => console.warn('SW Reg Fail:', err));
      });
    }

    // Check iOS PWA Banner
    function checkIosPwa() {
      const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      const isDismissed = localStorage.getItem('fear_pwa_dismissed');

      if (isIos && !isStandalone && !isDismissed) {
        document.getElementById('pwaBanner').style.display = 'flex';
      }
    }

    function dismissPwaBanner() {
      document.getElementById('pwaBanner').style.display = 'none';
      localStorage.setItem('fear_pwa_dismissed', 'true');
    }

    // Toast Notifications
    function showToast(message, isError = false) {
      const existing = document.querySelector('.toast-msg');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast-msg';
      toast.textContent = message;
      if (isError) {
        toast.style.borderColor = 'var(--danger-color)';
        toast.style.boxShadow = '0 8px 25px rgba(255, 59, 48, 0.4)';
      }
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // Volume Handling
    audio.volume = 0.7;
    audio.muted = false;
    function handleVolumeChange() {
      const val = parseInt(volumeSlider.value);
      audio.volume = val / 100;
      audio.muted = (val === 0);
      volumePercent.textContent = val + '%';
      
      if (val === 0) volumeIcon.textContent = '🔇';
      else if (val < 30) volumeIcon.textContent = '🔈';
      else if (val < 70) volumeIcon.textContent = '🔉';
      else volumeIcon.textContent = '🔊';

      if (val > 0) lastVolume = val;
    }

    function toggleMute() {
      if (parseInt(volumeSlider.value) > 0) {
        lastVolume = parseInt(volumeSlider.value);
        volumeSlider.value = 0;
      } else {
        volumeSlider.value = lastVolume || 70;
      }
      handleVolumeChange();
    }

    volumeSlider.addEventListener('input', handleVolumeChange);

    // Audio Progress & Formatting
    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateProgress() {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      const pctStr = pct + '%';
      
      mainScrubberFill.style.width = pctStr;
      miniProgressFill.style.width = pctStr;
      sheetScrubberFill.style.width = pctStr;

      const currFormatted = formatTime(audio.currentTime);
      const durFormatted = formatTime(audio.duration);

      currentTimeSpan.textContent = currFormatted;
      durationSpan.textContent = durFormatted;
      sheetCurrentTime.textContent = currFormatted;
      sheetDuration.textContent = durFormatted;

      // Update iOS MediaSession Position State
      if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
        try {
          navigator.mediaSession.setPositionState({
            duration: audio.duration,
            playbackRate: audio.playbackRate || 1.0,
            position: audio.currentTime
          });
        } catch (e) { /* ignore position errors */ }
      }
    }

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
      durationSpan.textContent = formatTime(audio.duration);
      sheetDuration.textContent = formatTime(audio.duration);
    });

    function seekMain(e) {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
      updateProgress();
    }

    audio.addEventListener('ended', () => nextSong());

    audio.addEventListener('play', () => {
      isPlaying = true;
      const pauseSvg = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      miniPlayIcon.innerHTML = pauseSvg;
      sheetPlayIcon.innerHTML = pauseSvg;
      vinylContainer.classList.add('spinning');
      
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'playing';
      }
      renderPlaylist();
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      const playSvg = '<polygon points="5 3 19 12 5 21 5 3"/>';
      miniPlayIcon.innerHTML = playSvg;
      sheetPlayIcon.innerHTML = playSvg;
      vinylContainer.classList.remove('spinning');

      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = 'paused';
      }
      renderPlaylist();
    });

    // Player Sheet Controls
    function openPlayerSheet() {
      document.getElementById('playerSheetModal').classList.add('open');
    }

    function closePlayerSheet() {
      document.getElementById('playerSheetModal').classList.remove('open');
    }

    // Google Drive Modal Controls
    function openDriveModal() {
      const savedKey = localStorage.getItem('fear_gdrive_api_key') || '';
      document.getElementById('driveApiKeyInput').value = savedKey;
      document.getElementById('gdriveModal').classList.add('open');
    }

    function closeDriveModal() {
      document.getElementById('gdriveModal').classList.remove('open');
    }

    // Extract File & Folder IDs from Google Drive URLs
    function parseDriveFileId(str) {
      if (!str) return '';
      const matchD = str.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (matchD) return matchD[1];
      const matchId = str.match(/id=([a-zA-Z0-9_-]+)/);
      if (matchId) return matchId[1];
      const clean = str.trim();
      if (/^[a-zA-Z0-9_-]{25,}$/.test(clean)) return clean;
      return '';
    }

    function parseDriveFolderId(str) {
      if (!str) return '';
      const matchFold = str.match(/folders\/([a-zA-Z0-9_-]+)/);
      if (matchFold) return matchFold[1];
      const clean = str.trim();
      if (/^[a-zA-Z0-9_-]{25,}$/.test(clean)) return clean;
      return '';
    }

    // Import Songs from Google Drive
    async function importFromGoogleDrive() {
      const rawText = document.getElementById('driveUrlInput').value.trim();
      const apiKey = document.getElementById('driveApiKeyInput').value.trim();
      if (apiKey) localStorage.setItem('fear_gdrive_api_key', apiKey);

      if (!rawText) {
        showToast("⚠️ Vui lòng dán link hoặc ID Google Drive", true);
        return;
      }

      const submitBtn = document.getElementById('driveSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = "⏳ Đang quét & Tải...";

      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      let fileQueue = [];

      for (let line of lines) {
        const folderId = parseDriveFolderId(line);
        if (folderId && line.includes('folders')) {
          if (!apiKey) {
            showToast("⚠️ Cần Google Drive API Key để quét Folder!", true);
          } else {
            showToast("🔍 Đang tìm bài hát trong Folder Drive...");
            try {
              const res = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+(mimeType+contains+'audio'+or+name+contains+'.mp3')&fields=files(id,name)&key=${apiKey}`);
              const data = await res.json();
              if (data.files && data.files.length > 0) {
                data.files.forEach(f => fileQueue.push({ id: f.id, name: f.name }));
              } else {
                showToast("⚠️ Không tìm thấy file MP3 trong Folder này", true);
              }
            } catch (err) {
              console.error(err);
              showToast("❌ Lỗi quét Folder Google Drive", true);
            }
          }
        } else {
          const fileId = parseDriveFileId(line);
          if (fileId) {
            fileQueue.push({ id: fileId, name: `GDrive_Track_${fileId.substr(0,6)}` });
          }
        }
      }

      if (fileQueue.length === 0) {
        showToast("⚠️ Không nhận diện được link Google Drive hợp lệ", true);
        submitBtn.disabled = false;
        submitBtn.innerHTML = "⚡ Tải Nhạc Vào Máy";
        return;
      }

      let successCount = 0;
      for (let i = 0; i < fileQueue.length; i++) {
        const item = fileQueue[i];
        showToast(`📥 Đang tải [${i+1}/${fileQueue.length}]: ${item.name}...`);
        
        let validBlob = null;
        const candidateUrls = [
          `https://drive.google.com/uc?export=download&confirm=no_antivirus&id=${item.id}`,
          `https://lh3.googleusercontent.com/u/0/d/${item.id}`,
          `https://docs.google.com/uc?export=download&id=${item.id}`
        ];

        for (let dlUrl of candidateUrls) {
          try {
            const res = await fetch(dlUrl);
            if (res.ok) {
              const tempBlob = await res.blob();
              const sampleText = await tempBlob.slice(0, 150).text().catch(() => '');
              if (!sampleText.includes('<!DOCTYPE') && !sampleText.includes('<html') && tempBlob.size > 20000) {
                validBlob = new Blob([tempBlob], { type: 'audio/mpeg' });
                break;
              }
            }
          } catch(e) {}
        }

        // Try CORS Proxy if direct fetch blocked
        if (!validBlob) {
          try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://drive.google.com/uc?export=download&confirm=no_antivirus&id=${item.id}`)}`;
            const resProxy = await fetch(proxyUrl);
            if (resProxy.ok) {
              const tempBlob = await resProxy.blob();
              const sampleText = await tempBlob.slice(0, 150).text().catch(() => '');
              if (!sampleText.includes('<!DOCTYPE') && !sampleText.includes('<html') && tempBlob.size > 20000) {
                validBlob = new Blob([tempBlob], { type: 'audio/mpeg' });
              }
            }
          } catch (e2) {
            console.error("Proxy fetch failed:", e2);
          }
        }

        if (validBlob) {
          const songId = 'g_' + item.id + '_' + Date.now();
          const cleanTitle = item.name.replace(/\.(mp3|mpeg)$/i, "");
          
          await saveSongFile(songId, validBlob, {
            title: cleanTitle,
            artist: "Google Drive",
            cover: "./bick.jpg",
            dateAdded: Date.now()
          });

          playlists[currentPlaylistName].push({
            id: songId,
            title: cleanTitle,
            artist: "Google Drive",
            cover: "./bick.jpg",
            dateAdded: Date.now()
          });
          
          savePlaylists();
          successCount++;
        } else {
          showToast(`⚠️ Link file "${item.name}" bị khóa hoặc chưa bật quyền Công khai (Anyone with link)`, true);
        }
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = "⚡ Tải Nhạc Vào Máy";
      closeDriveModal();

      if (successCount > 0) {
        renderPlaylist();
        renderTabs();
        showToast(`✅ Đã lưu ${successCount} bài hát Google Drive Offline!`);
      }
    }

    // IndexedDB Management
    function initDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open("MusicPlayerDB", 5);
        req.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("songFiles")) {
            db.createObjectStore("songFiles", { keyPath: "id" });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
        req.onerror = () => { console.log("DB error"); resolve(); };
      });
    }

    async function saveSongFile(id, file, metadata) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction("songFiles", "readwrite");
        const store = tx.objectStore("songFiles");
        store.put({ id, blob: file, ...metadata });
        tx.oncomplete = () => resolve();
        tx.onerror = (err) => reject(err);
      });
    }

    async function getSongFile(id) {
      return new Promise((resolve) => {
        if (!db) { resolve(null); return; }
        const tx = db.transaction("songFiles", "readonly");
        const store = tx.objectStore("songFiles");
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    // Playlist State Management
    function loadPlaylists() {
      const saved = localStorage.getItem('playlists_v4');
      if (saved) {
        playlists = JSON.parse(saved);
      } else {
        playlists = { "❤️": [] };
      }
      if (!playlists["❤️"]) playlists["❤️"] = [];
      currentPlaylistName = "❤️";
    }

    function savePlaylists() {
      localStorage.setItem('playlists_v4', JSON.stringify(playlists));
    }

    async function addSongToPlaylist(file) {
      if (!file.name.toLowerCase().endsWith('.mp3') && !file.name.toLowerCase().endsWith('.mpeg')) {
        showToast(`⚠️ ${file.name} phải là file MP3`, true);
        return false;
      }

      const id = 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      const title = file.name.replace(/\.(mp3|mpeg)$/i, "");
      
      try {
        const audioBlob = new Blob([file], { type: 'audio/mpeg' });
        await saveSongFile(id, audioBlob, { title, artist: "Local MP3", cover: "./bick.jpg", dateAdded: Date.now() });
        playlists[currentPlaylistName].push({
          id, title, artist: "Local MP3", cover: "./bick.jpg", dateAdded: Date.now()
        });
        savePlaylists();
        return true;
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    function addSongs() {
      fileInput.click();
    }

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      
      showToast(`📀 Đang lưu ${files.length} bài hát vào máy...`);
      let added = 0;
      for (let file of files) {
        if (await addSongToPlaylist(file)) added++;
      }
      
      if (added > 0) {
        renderPlaylist();
        renderTabs();
        showToast(`✅ Đã thêm ${added} bài hát Offline!`);
      } else {
        showToast(`❌ Lỗi thêm bài hát`, true);
      }
      fileInput.value = '';
    });

    async function playSong(playlistName, index) {
      const playlist = playlists[playlistName];
      if (!playlist || index < 0 || index >= playlist.length) return;
      
      currentPlaylistName = playlistName;
      currentIndex = index;
      const song = playlist[currentIndex];
      currentSongId = song.id;
      
      const fileData = await getSongFile(song.id);
      if (!fileData || !fileData.blob) {
        showToast(`❌ Không thấy file local: ${song.title}`, true);
        return;
      }

      // Check if stored Blob is HTML error
      if (fileData.blob.size < 15000) {
        const sampleText = await fileData.blob.slice(0, 150).text().catch(() => '');
        if (sampleText.includes('<!DOCTYPE') || sampleText.includes('<html')) {
          showToast(`⚠️ File "${song.title}" bị lỗi (Cần mở quyền công khai Google Drive)`, true);
          return;
        }
      }

      // Wrap in explicit audio/mpeg Blob
      const audioBlob = new Blob([fileData.blob], { type: 'audio/mpeg' });

      if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
      currentBlobUrl = URL.createObjectURL(audioBlob);
      
      audio.muted = false;
      audio.src = currentBlobUrl;
      audio.load();
      
      // Update UI titles
      heroTitle.textContent = song.title;
      heroArtist.textContent = song.artist;
      barTitle.textContent = song.title;
      barArtist.textContent = song.artist;
      sheetTitle.textContent = song.title;
      sheetArtist.textContent = song.artist;
      
      const coverUrl = song.cover || "./bick.jpg";
      albumArt.src = coverUrl;
      barCover.src = coverUrl;
      sheetCover.src = coverUrl;
      
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title, artist: song.artist,
          artwork: [{ src: coverUrl, sizes: '512x512' }]
        });
      }
      
      try { await audio.play(); } catch(e) { console.log(e); }
      renderPlaylist();
      renderTabs();
    }

    async function togglePlay() {
      if (!audio.src || audio.src === "" || audio.src === "about:blank") {
        const songs = playlists[currentPlaylistName];
        if (songs?.length) playSong(currentPlaylistName, 0);
        return;
      }
      
      if (isPlaying) {
        audio.pause();
      } else {
        try {
          audio.muted = false;
          await audio.play();
        } catch (err) {
          console.warn("Play error, reloading Blob:", err);
          if (currentSongId) {
            const fileData = await getSongFile(currentSongId);
            if (fileData?.blob) {
              const audioBlob = new Blob([fileData.blob], { type: 'audio/mpeg' });
              if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
              currentBlobUrl = URL.createObjectURL(audioBlob);
              const savedTime = audio.currentTime || 0;
              audio.muted = false;
              audio.src = currentBlobUrl;
              audio.load();
              audio.currentTime = savedTime;
              setTimeout(() => audio.play().catch(e => console.log(e)), 100);
            }
          }
        }
      }
    }

    function nextSong() {
      const songs = playlists[currentPlaylistName];
      if (!songs?.length) return;
      let nextIdx = currentIndex + 1;
      if (nextIdx >= songs.length) nextIdx = 0;
      playSong(currentPlaylistName, nextIdx);
    }

    function prevSong() {
      const songs = playlists[currentPlaylistName];
      if (!songs?.length) return;
      let prevIdx = currentIndex - 1;
      if (prevIdx < 0) prevIdx = songs.length - 1;
      playSong(currentPlaylistName, prevIdx);
    }

    // Tabs Render
    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      if (!container) return;
      
      const html = Object.keys(playlists).map(name => {
        const isActive = (name === currentPlaylistName);
        const isLiked = (name === "❤️");
        return `
          <button class="tab-btn ${isActive ? 'active' : ''}" onclick="switchPlaylist('${name.replace(/'/g, "\\'")}')">
            <span>${isLiked ? '❤️' : '📁'}</span>
            <span>${name === "❤️" ? 'Yêu thích' : escapeHtml(name)}</span>
          </button>
        `;
      }).join('');
      
      container.innerHTML = html;
    }

    function createNewPlaylist() {
      const name = prompt("Nhập tên Playlist mới:");
      if (!name?.trim()) return;
      const trimmed = name.trim();
      if (playlists[trimmed]) { showToast("Playlist đã tồn tại!", true); return; }
      playlists[trimmed] = [];
      savePlaylists();
      renderTabs();
      switchPlaylist(trimmed);
      showToast(`✅ Đã tạo "${trimmed}"`);
    }

    function switchPlaylist(name) {
      currentPlaylistName = name;
      selectedSongs.clear();
      renderTabs();
      renderPlaylist();
    }

    function filterSongs() {
      currentSearchQuery = document.getElementById('searchInput').value.toLowerCase();
      renderPlaylist();
    }

    // Playlist Songs Render
    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      const titleEl = document.getElementById('playlistSectionTitle');
      let songs = playlists[currentPlaylistName] || [];
      
      if (titleEl) {
        const icon = currentPlaylistName === "❤️" ? "❤️" : "📁";
        titleEl.innerHTML = `${icon} ${escapeHtml(currentPlaylistName)} (${songs.length})`;
      }

      if (currentSearchQuery.trim()) {
        songs = songs.filter(s => s.title.toLowerCase().includes(currentSearchQuery) || s.artist.toLowerCase().includes(currentSearchQuery));
      }
      
      if (songs.length === 0) {
        let msg = currentPlaylistName === "❤️" 
          ? "Chưa có bài hát nào.<br>Nhấn <strong>+</strong> để chọn MP3 hoặc nút <strong>☁️ Drive</strong> để tải từ Google Drive."
          : "Playlist trống.<br>Nhấn nút <strong>+</strong> hoặc <strong>☁️ Drive</strong> để thêm bài hát.";
        container.innerHTML = `<div class="empty-state-box">🎵 ${msg}</div>`;
      } else {
        container.innerHTML = songs.map((song, idx) => {
          const isCurrent = (currentSongId === song.id);
          const isChecked = selectedSongs.has(song.id);
          
          return `
            <div class="song-card ${isCurrent ? 'playing' : ''}" onclick="playSongByIndex(${idx})">
              <div class="custom-checkbox ${isChecked ? 'checked' : ''}" 
                   onclick="event.stopPropagation(); toggleSelect('${song.id}')"></div>
              <img class="song-thumb" src="${song.cover || './bick.jpg'}" onerror="this.src='./bick.jpg'">
              <div class="song-details">
                <div class="song-name">${escapeHtml(song.title)}</div>
                <div class="song-sub">${escapeHtml(song.artist)}</div>
              </div>
              ${isCurrent && isPlaying ? `
                <div class="playing-indicator">
                  <span></span><span></span><span></span>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }
      
      const deleteBtn = document.getElementById('deleteSelectedBtn');
      if (deleteBtn) deleteBtn.style.display = selectedSongs.size > 0 ? 'flex' : 'none';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[m]));
    }

    window.playSongByIndex = function(filteredIndex) {
      let songs = playlists[currentPlaylistName] || [];
      if (currentSearchQuery.trim()) {
        const filtered = songs.filter(s => s.title.toLowerCase().includes(currentSearchQuery) || s.artist.toLowerCase().includes(currentSearchQuery));
        if (filteredIndex >= 0 && filteredIndex < filtered.length) {
          const originalIndex = songs.findIndex(s => s.id === filtered[filteredIndex].id);
          if (originalIndex !== -1) playSong(currentPlaylistName, originalIndex);
        }
      } else {
        playSong(currentPlaylistName, filteredIndex);
      }
    };

    window.toggleSelect = function(songId) {
      selectedSongs.has(songId) ? selectedSongs.delete(songId) : selectedSongs.add(songId);
      renderPlaylist();
    };

    window.toggleSelectAll = function() {
      const songs = playlists[currentPlaylistName] || [];
      if (selectedSongs.size === songs.length && songs.length > 0) {
        selectedSongs.clear();
      } else {
        songs.forEach(s => selectedSongs.add(s.id));
      }
      renderPlaylist();
    };

    window.deleteSelected = function() {
      if (selectedSongs.size === 0) return;
      if (!confirm(`Xóa ${selectedSongs.size} bài hát đã chọn?`)) return;
      
      playlists[currentPlaylistName] = playlists[currentPlaylistName].filter(s => !selectedSongs.has(s.id));
      
      if (selectedSongs.has(currentSongId)) {
        if (playlists[currentPlaylistName].length > 0) {
          playSong(currentPlaylistName, 0);
        } else {
          audio.pause();
          audio.src = '';
          currentSongId = null;
          heroTitle.textContent = "Chọn bài hát phát";
          heroArtist.textContent = "FEAR Player Local";
          barTitle.textContent = "Chưa phát nhạc";
          barArtist.textContent = "Nhấn để chọn bài";
          sheetTitle.textContent = "Chưa phát nhạc";
          sheetArtist.textContent = "";
          vinylContainer.classList.remove('spinning');
        }
      }
      
      selectedSongs.clear();
      savePlaylists();
      renderPlaylist();
      showToast("🗑 Đã xóa bài hát khỏi danh sách");
    };

    // Lockscreen MediaSession API Configuration
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', async () => {
        try {
          audio.muted = false;
          await audio.play();
        } catch (err) {
          console.warn("Lockscreen play retry:", err);
          if (currentSongId) {
            const fileData = await getSongFile(currentSongId);
            if (fileData?.blob) {
              const audioBlob = new Blob([fileData.blob], { type: 'audio/mpeg' });
              if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
              currentBlobUrl = URL.createObjectURL(audioBlob);
              const savedTime = audio.currentTime || 0;
              audio.muted = false;
              audio.src = currentBlobUrl;
              audio.load();
              audio.currentTime = savedTime;
              try { await audio.play(); } catch(e2) { console.error(e2); }
            }
          }
        }
      });

      navigator.mediaSession.setActionHandler('pause', () => {
        audio.pause();
      });

      navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());

      try {
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (details.seekTime !== undefined && audio.duration) {
            audio.currentTime = details.seekTime;
            updateProgress();
          }
        });
      } catch(e) {}

      try {
        navigator.mediaSession.setActionHandler('seekbackward', (details) => {
          const skipTime = details.seekOffset || 10;
          audio.currentTime = Math.max(audio.currentTime - skipTime, 0);
          updateProgress();
        });
      } catch(e) {}

      try {
        navigator.mediaSession.setActionHandler('seekforward', (details) => {
          const skipTime = details.seekOffset || 10;
          audio.currentTime = Math.min(audio.currentTime + skipTime, audio.duration || 0);
          updateProgress();
        });
      } catch(e) {}
    }

    async function init() {
      loadPlaylists();
      await initDB();
      handleVolumeChange();
      renderTabs();
      renderPlaylist();
      checkIosPwa();
    }
    
    init();
  </script>
</body>
</html>
